name: Next.js CI Pipeline

# This tells GitHub to run the action whenever you push to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # This spins up a fresh virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
    # Step 1: Grabs your code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Installs Node.js on the virtual machine
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # You can change this to 18 if you are using an older version
        cache: 'npm'

    # Step 3: Installs all your project dependencies
    - name: Install Dependencies
      run: npm ci # 'npm ci' is strictly for automated environments, faster than 'npm install'

    # Step 4: Runs the Next.js build process to ensure there are no fatal errors
    - name: Build Application
      run: npm run build
